<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Data Table</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="table-container">
        <h2 class="table-title">FIFA Fan's Data Table</h2>
        <div id="clock"></div> <!-- Canlı Saat -->

        <!-- Veri Ekleme Formu -->
        <form id="player-form">
            <div class="input-group">
                <label for="player-name">Player Name:</label>
                <input type="text" id="player-name" required>
            </div>
            <div class="input-group">
                <label for="club">Club:</label>
                <input type="text" id="club" required>
            </div>
            <div class="input-group">
                <label for="position">Position:</label>
                <input type="text" id="position" required>
            </div>
            <div class="input-group">
                <label for="goals">Goals:</label>
                <input type="number" id="goals" required>
            </div>
            <button type="submit" class="add-btn">Add Player</button>
        </form>

        <!-- Tablo -->
        <table class="styled-table">
            <thead>
                <tr>
                    <th>#</th>
                    <th>Player Name</th>
                    <th>Club</th>
                    <th>Position</th>
                    <th>Goals</th>
                    <th>Action</th>
                </tr>
            </thead>
            <tbody id="table-body">
                <!-- Kullanıcı eklediği veriler burada gözükecek -->
            </tbody>
        </table>

        <button class="logout-btn" onclick="logout()">Logout</button>
    </div>

    <div class="corner-flag"></div>
    <div class="corner-flag-reverse"></div>

    <script src="table.js" defer></script>
</body>
</html>
